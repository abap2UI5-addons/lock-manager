name: ci

# The checks of this repository, from the shared CI template of
# abap2UI5-addons (rap-ext, .github/ci/README.md):
#
#   abaplint      Standard ABAP (abaplint.jsonc)
#   rename        the namespace rename check (npm run rename)
#   abap2ui5lint  the app classes and their views (abap2ui5lint.jsonc), on
#                 main the README badges, published to the branch `badges`
#
# No ABAP Cloud lint: the lock manager is classic ABAP by design (a
# background report, BP_EVENT_RAISE, the kernel ENQUEUE_* function modules) -
# AGENTS.md, CI. No ABAP Unit tests to run. abap2UI5 is resolved from its
# main branch with no version pin: the weekly run notices an upstream rename
# while no pull request is open.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # write only for publish-badges, which runs on main and never for a pull
    # request; every job that runs the code keeps a read-only token
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-check.yaml@c81dfd461f69e42bb3678f51f80804066e2c9f96 # ci-v1.0.0
    with:
      abaplint: '["./abaplint.jsonc"]'
      rename: true
      canary: ${{ github.event_name == 'schedule' }}
